name: test
on:
  - push
  - pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
      - run: go build ./...
      - run: gofmt -d .
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go fix -diff ./...
      - run: go test -v -race -cover ./...
